name: NuVa
options:
  developmentLanguage: en
  bundleIdPrefix: pt.nunomartins
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  NuVa:
    type: application
    platform: macOS
    sources:
      - App
      - Sources
      - path: Resources
        optional: true
      # Shown in NuVa ▸ Terms and Privacy.
      - path: TERMS.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.nunomartins.nuva
        PRODUCT_NAME: NuVa
        MARKETING_VERSION: "1.17"
        CURRENT_PROJECT_VERSION: "21"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NuVa
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # Only what the build settings above can't say: the kinds of thing the Finder may hand to NuVa
    # ("Open With", a drop on the Dock icon). Alternate, so NuVa never takes a file type for itself.
    info:
      path: App/Info.plist
      properties:
        # XcodeGen would otherwise write 1.0 and 1 here, over the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.xiph.flac
              - public.mp3
              - com.apple.m4a-audio
              - public.mpeg-4-audio
              - public.aac-audio
              - com.microsoft.waveform-audio
              - public.aiff-audio
              - public.aifc-audio
    entitlements:
      path: App/NuVa.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        # Audio CDs mount in /Volumes (cddafs); NuVa only reads the volumes that are audio CDs.
        com.apple.security.temporary-exception.files.absolute-path.read-only:
          - /Volumes/
  NuVaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: NuVa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.nunomartins.nuva.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NuVa.app/Contents/MacOS/NuVa"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  NuVa:
    build:
      targets:
        NuVa: all
        NuVaTests: [test]
    test:
      targets:
        - NuVaTests
